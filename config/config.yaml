# ==============================================================================
# Global GenAI Configuration Settings
# ==============================================================================

app:
  name: "GenAI Tutorial & Development Framework"
  version: "1.0.0"
  environment: "development"

models:
  default_llm: "gpt2"
  default_embedding: "sentence-transformers/all-MiniLM-L6-v2"
  generation:
    max_new_tokens: 100
    temperature: 0.7
    top_p: 0.9
    repetition_penalty: 1.1

rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3
  vector_db_path: "data/vector_db"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  vector_db: "data/vector_db"
  logs: "logs"
